<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello</title>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/alexbjchen/alexanderchen.net/refs/heads/main/location-arrow-solid-red.png">
    <link href="" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            font-family: 'Inter', sans-serif;
            color: white;
        }

        .bg-image {
            background-image: url('https://raw.githubusercontent.com/alexbjchen/alexanderchen.net/abda4014b7e1a0d240cc5313662013d5dae73ef5/andre-frueh-unsplash-toronto.jpg'); 
            height: 100%;
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .overlay {
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .profile-container {
            text-align: center;
            padding: 20px;
        }

        .top-line {
            font-size: 3rem; 
            font-weight: 600;
            margin-bottom: 15px;
            letter-spacing: -1px;
        }

        .profession {
            font-weight: 300;
            font-size: 2.2rem;
            margin-left: 10px;
        }

        .bottom-line {
            font-size: 1.2rem;
            font-weight: 300;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .location, .linkedin {
            display: flex;
            align-items: center;
            gap: 8px; 
        }

        .divider {
            opacity: 0.6;
        }

        .linkedin a {
            color: white;
            text-decoration: none;
            transition: opacity 0.3s ease;
        }

        .linkedin a:hover {
            opacity: 0.8;
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .top-line { 
                font-size: 2rem; 
                display: flex; 
                flex-direction: column;
                gap: 10px;
            }
            .profession { 
                font-size: 1.5rem; 
                margin-left: 0; 
            }
            .divider { display: none; }
            .bottom-line { 
                flex-direction: column; 
                gap: 8px; 
            }
        }
    </style>
</head>

<body>
    <div class="bg-image">
        <div class="overlay">
            <div class="profile-container">

                <div class="top-line">
                    Bingjie Chen (Alex) <span class="divider">|</span> <span class="profession">Delivery Driver, Uber</span>
                </div>

                <div class="bottom-line">
                    <span class="location">
                        <i class="fa-solid fa-location-dot"></i> 
                        Toronto, Ontario, Canada
                    </span>

                    <span class="divider">|</span>

                    <span class="linkedin">
                        <i class="fa-brands fa-linkedin"></i> 
                        <a href="https://www.linkedin.com/in/bingjiechencanada/" target="_blank">https://www.linkedin.com/in/bingjiechencanada/</a>
                    </span>

                </div>

            </div>
        </div>
    </div>
</body>
</html>
